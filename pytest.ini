[pytest]
# pytest 配置文件

# 测试文件模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 排除目录
norecursedirs = 
    .git
    __pycache__
    *.egg

# 输出选项
# By default, exclude integration and e2e tests that require external services
# To run integration tests: pytest -m integration
# To run e2e tests: pytest -m e2e
addopts = 
    -v
    --strict-markers
    --tb=short
    -m "not integration and not e2e"

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    e2e: 端到端测试
    benchmark: 性能基准测试

