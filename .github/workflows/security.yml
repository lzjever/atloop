name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scan weekly on Sundays at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Install pip-audit
        run: |
          uv pip install pip-audit

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          uv run pip-audit --desc --no-deps
        continue-on-error: true

      - name: Install bandit
        run: |
          uv pip install bandit[toml]

      - name: Run bandit (code security scan)
        run: |
          uv run bandit -r atloop/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Check for critical vulnerabilities
        run: |
          # Fail if pip-audit finds critical vulnerabilities
          if uv run pip-audit --desc --no-deps 2>&1 | grep -i "critical\|high"; then
            echo "❌ Critical or high severity vulnerabilities found!"
            exit 1
          else
            echo "✅ No critical vulnerabilities found"
          fi
